<script>
/* Lay each line where the print has it. The baseline is measured in the browser (a line box puts
   it at a font-dependent depth), then each line is fitted to the width it has in the PDF: word
   spacing first, letter spacing next, and any last fraction of a pixel by scaling the line.
   The text is set in the same face as the print, so the corrections are small. */
(function(){
  var R={};
  function base(cls){
    if(R[cls]!=null) return R[cls];
    var p=document.createElement('p'); p.className=cls;
    p.style.cssText='left:-9999px;top:0;font-size:100px;visibility:hidden';
    p.innerHTML='Hx<i style="display:inline-block;width:0;height:0;vertical-align:baseline"></i>';
    document.body.appendChild(p);
    var v=p.querySelector('i').offsetTop/100; p.parentNode.removeChild(p);
    return (R[cls]=v);
  }
  function fit(){
    R={};
    var ps=document.querySelectorAll('p[data-w]');
    for(var i=0;i<ps.length;i++){
      var p=ps[i], fs=parseFloat(p.style.fontSize)||12;
      var b=parseFloat(p.getAttribute('data-b'));
      if(isFinite(b)) p.style.top=(b-base(p.className)*fs).toFixed(2)+'px';
      var g=parseFloat(p.getAttribute('data-g'))||1;
      p.style.wordSpacing=''; p.style.letterSpacing=''; p.style.transform=(g!==1?'scaleX('+g+')':'');
      var target=parseFloat(p.getAttribute('data-w')), nat=p.offsetWidth;
      if(!target||!nat) continue;
      var d=target-nat;
      if(p.className==='gh'){ if(Math.abs(d)>0.5) p.style.transform='scaleX('+(g*target/nat).toFixed(4)+')'; continue; }
      if(Math.abs(d)<0.4) continue;
      var txt=p.textContent||'', sp=(txt.match(/ /g)||[]).length;
      if(sp>0){
        var ws=d/sp, cap=fs*0.6, floor=-fs*0.12;
        if(ws>cap)ws=cap; if(ws<floor)ws=floor;
        p.style.wordSpacing=ws.toFixed(3)+'px';
        nat=p.offsetWidth; d=target-nat;
      }
      if(Math.abs(d)>0.6){
        var n=Math.max(1,txt.length-1), ls=d/n, lim=fs*0.04;
        if(ls>lim)ls=lim; if(ls<-lim)ls=-lim;
        p.style.letterSpacing=ls.toFixed(3)+'px';
        nat=p.offsetWidth; d=target-nat;
      }
      if(Math.abs(d)>0.6){
        var k=target/nat; if(k>1.04)k=1.04; if(k<0.96)k=0.96;
        p.style.transform='scaleX('+(g*k).toFixed(4)+')';
      }
    }
  }
  fit();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
<script>
/* A contents entry asks the parent reader to jump; on its own the page follows the link. */
document.addEventListener('click',function(e){
  var a=e.target && e.target.closest ? e.target.closest('a.ixlink') : null;
  if(!a) return;
  var m=/#\/page\/([^\/]+)\/(\d+)/.exec(a.getAttribute('href')||'');
  if(!m) return;
  if(window.parent && window.parent!==window){
    e.preventDefault();
    try{ window.parent.postMessage({abk:'page',iss:m[1],p:parseInt(m[2],10)},'*'); }
    catch(err){ location.href=a.getAttribute('href'); }
  }
},true);
</script>
<script>
/* A picture asks the parent reader to open its lightbox; on its own the page just opens the picture. */
document.addEventListener('click',function(e){
  var a=e.target && e.target.closest ? e.target.closest('a.zoom') : null;
  if(!a) return;
  if(window.parent && window.parent!==window){
    e.preventDefault();
    var m={abk:'img',src:a.getAttribute('data-src'),alt:a.getAttribute('data-alt')||'',cap:a.getAttribute('data-cap')||''};
    try{ window.parent.postMessage(m,'*'); }catch(err){ location.href=a.getAttribute('href'); }
  }
},true);
</script>
<script>
/* The reader tells this page how big to draw itself, so text is re-rendered at the new size. */
(function(){
  function setK(k){ document.documentElement.style.setProperty('--k', String(k)); }
  window.addEventListener('message',function(e){ var m=e.data; if(m&&m.abk==='zoom'&&isFinite(m.k)&&m.k>0) setK(m.k); });
})();
</script>
<style>html.bee-on,html.bee-on *{cursor:none !important}</style>
<script>
/* Report the pointer to the parent reader so its bee can follow across the page,
   and hide this document's own cursor only once the parent confirms the bee is on. */
(function(){
  if(window.parent===window) return;
  if(!matchMedia('(hover:hover)').matches) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  window.addEventListener('message',function(e){
    var m=e.data; if(m&&m.abk==='bee') document.documentElement.classList.toggle('bee-on',!!m.on);
  });
  try{ parent.postMessage({abk:'hello'},'*'); }catch(e){}
  var raf=0,px=0,py=0,pl=false;
  document.addEventListener('mousemove',function(e){
    px=e.clientX; py=e.clientY;
    /* the page hit-tests itself and tells the parent, because a parent cannot
       look inside a same-origin iframe when both are local files */
    pl=!!(e.target&&e.target.closest&&e.target.closest('a[href],area[href],.fn'));
    if(!raf) raf=requestAnimationFrame(function(){ raf=0;
      try{ parent.postMessage({abk:'pointer',x:px,y:py,link:pl},'*'); }catch(err){} });
  },{passive:true});
  document.addEventListener('mouseleave',function(){
    try{ parent.postMessage({abk:'pointerleave'},'*'); }catch(err){} });
})();
/* keys pressed while a page has the focus (after a click on it) still reach the reader:
   Esc closes the lightbox or a panel, the arrows move between lanes */
(function(){
  if(window.parent===window) return;
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'||e.key==='ArrowLeft'||e.key==='ArrowRight'){ try{ parent.postMessage({abk:'key',key:e.key},'*'); }catch(err){} }
  });
})();
</script>
<script>
/* Note numbers as hover text: rest on a superscript and its reference appears beside it;
   a tap does the same on a touch screen; Esc or moving away hides it. */
(function(){
  var pop=null, cur=null;
  function show(el){
    if(!pop){ pop=document.createElement('div'); pop.className='fnpop'; pop.setAttribute('role','tooltip'); document.body.appendChild(pop); }
    var n=el.getAttribute('data-n'); pop.innerHTML=(n?'<b>'+n+'</b>':'')+el.getAttribute('data-note').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});
    pop.style.display='block'; pop.style.left='0px'; pop.style.top='0px';
    var r=el.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
    var x=Math.min(Math.max(6,r.left+r.width/2-pw/2), innerWidth-pw-6), y=r.top-ph-8;
    if(y<4) y=r.bottom+8;
    pop.style.left=x+'px'; pop.style.top=y+'px'; cur=el;
  }
  function hide(){ if(pop) pop.style.display='none'; cur=null; }
  var fns=document.querySelectorAll('.fn');
  for(var i=0;i<fns.length;i++){
    var el=fns[i];
    el.addEventListener('mouseenter',function(){ show(this); });
    el.addEventListener('mouseleave',hide);
    el.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); if(cur===this) hide(); else show(this); });
  }
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') hide(); });
  document.addEventListener('click',function(){ hide(); });
})();
</script>
