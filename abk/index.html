/* ---------- horizontal track: lane 0 = the issue, lane 1 = a topic "special issue" ---------- */
.track{position:fixed;inset:var(--chromeH) 0 0;display:flex;width:300%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform:translateX(-33.3334%)}
.track.right{transform:translateX(-66.6667%)}

.edge{position:fixed;top:50%;transform:translateY(-50%);z-index:70;background:rgba(41,56,77,.85);
  color:#c9c4b5;border:none;border-radius:0 8px 8px 0;padding:13px 8px 13px 5px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:row;align-items:center;gap:6px;transition:background .15s,color .15s}
.edge .chev{width:0;height:0;flex:0 0 auto;
  border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid currentColor}

.edge:hover{background:var(--gold);color:#111}
/* the "come back" tab: only exists while you have gone right into a topic or author lane.
   In the tab's own (sideways) orientation it stacks ON TOP of the outer tab - which on screen
   means immediately to its right, at the same height: one layer further out from the edge,
   so the outer site reads as two steps away. Its left edge is set from the outer tab's measured width. */
.edge.back{display:none;background:rgba(33,56,94,.86);color:#edf1f7;border-radius:8px}
.edge.back:hover{background:var(--gold);color:#111}

/* ---------- the bee (replaces the pointer on hover devices) ---------- */
#beecur{position:fixed;left:0;top:0;width:58px;height:51px;z-index:600;pointer-events:none;
 transform-origin:0 0;   /* rotate about the pointer, not the box centre - otherwise the bee orbits it */
 will-change:transform;opacity:0;transition:opacity .22s}
#beecur.on{opacity:1}
#beecur svg{width:100%;height:100%;overflow:visible;
 filter:drop-shadow(0 2px 1.5px rgba(22,30,43,.30))}
#beecur .bee-body{animation:beebob .9s ease-in-out infinite alternate;transform-origin:40px 40px}
#beecur .w{animation-duration:.082s;animation-timing-function:linear;animation-iteration-count:infinite;
 animation-direction:alternate;filter:blur(.25px)}
#beecur .fl{animation-name:flapL}
#beecur .fr{animation-name:flapR}
#beecur .hl{animation-name:flapLh;animation-delay:-.03s}
#beecur .hr{animation-name:flapRh;animation-delay:-.03s}
@keyframes flapL {from{transform:rotate(-17deg)} to{transform:rotate(23deg)}}
@keyframes flapR {from{transform:rotate(17deg)}  to{transform:rotate(-23deg)}}
@keyframes flapLh{from{transform:rotate(-12deg)} to{transform:rotate(16deg)}}
@keyframes flapRh{from{transform:rotate(12deg)}  to{transform:rotate(-16deg)}}
@keyframes beebob{from{transform:translateY(0)} to{transform:translateY(-1.4px)}}
/* landing: still for 2s over a surface and she settles - wings fold back over the abdomen, legs spread, shadow closes up */
#beecur .w,#beecur .legs,#beecur .bee-body{transition:transform .55s cubic-bezier(.3,.7,.25,1)}
#beecur svg{transition:filter .55s}
#beecur .legs{transform-origin:40px 40px}
#beecur.landed .bee-body{animation:none;transform:scale(.95)}
#beecur.landed svg{filter:drop-shadow(0 .6px .7px rgba(22,30,43,.38))}
#beecur.landed .w{animation:none;filter:none}
#beecur.landed .fl{transform:rotate(-82deg) scale(1.02,.7)}
#beecur.landed .fr{transform:rotate(82deg) scale(1.02,.7)}
#beecur.landed .hl{transform:rotate(-72deg) scale(.9,.7)}
#beecur.landed .hr{transform:rotate(72deg) scale(.9,.7)}
#beecur.landed .legs{transform:scale(1.22,1.06)}
/* perched: the same pose, reached fast. Folding as a cue that something is
   clickable has to keep up with the pointer - the .55s settle above is right
   for a bee choosing to land, and far too slow to read as a response to a
   hover, so this is a separate class rather than a tweak to that one. */
#beecur.perched .w,#beecur.perched .legs,#beecur.perched .bee-body{transition:transform .13s ease-out}
#beecur.perched svg{transition:filter .13s}
#beecur.perched .bee-body{animation:none;transform:scale(.97)}
#beecur.perched svg{filter:drop-shadow(0 .6px .7px rgba(22,30,43,.34))}
#beecur.perched .w{animation:none;filter:none}
#beecur.perched .fl{transform:rotate(-82deg) scale(1.02,.7)}
#beecur.perched .fr{transform:rotate(82deg) scale(1.02,.7)}
#beecur.perched .hl{transform:rotate(-72deg) scale(.9,.7)}
#beecur.perched .hr{transform:rotate(72deg) scale(.9,.7)}
#beecur.perched .legs{transform:scale(1.22,1.06)}
/* foraging: perched on the anthers, working the flower. Baskets fill with --pollen (0..1) and stay
   filled for the rest of the visit; the dust only shows while she is on the flower. */
#beecur .bk{transform-box:fill-box;transform-origin:center;transition:transform .6s ease-out}
#beecur .bkl{transform:rotate(-28deg) scale(var(--pollen,0))}
#beecur .bkr{transform:rotate(28deg) scale(var(--pollen,0))}
#beecur.foraging .bee-body{animation:forage .32s ease-in-out infinite alternate;transform:scale(.95)}
#beecur.foraging .legs{animation:foragelegs .32s ease-in-out infinite alternate}
@keyframes forage{from{transform:rotate(-4deg) scale(.95)}to{transform:rotate(4deg) scale(.95) translate(0,1.2px)}}
@keyframes foragelegs{from{transform:scale(1.22,1.06)}to{transform:scale(1.26,1.1)}}
#beecur .d{opacity:0}
#beecur.foraging .d{animation:dust 1.1s ease-out infinite}
#beecur.foraging .d2{animation-delay:-.3s}#beecur.foraging .d3{animation-delay:-.55s}#beecur.foraging .d4{animation-delay:-.8s}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--dx,6px),14px)}}
#beecur .d1{--dx:-7px}#beecur .d2{--dx:6px}#beecur .d3{--dx:-9px}#beecur .d4{--dx:8px}
#beecur.foraging.unloading .d{animation-name:unload}
#beecur.foraging:not(.unloading) .d{animation-name:dust}
@keyframes unload{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(calc(var(--dx,6px)*.3),22px)}}
#beecur.foraging.unloading .bee-body{animation-duration:.5s}
#beecur.spent .d{animation:none}
@media (prefers-reduced-motion:reduce){#beecur.foraging .bee-body,#beecur.foraging .legs,#beecur.foraging .d{animation:none}}
@media(hover:hover){ body.bee-on, body.bee-on *{cursor:none !important} }
@media(prefers-reduced-motion:reduce){ #beecur{display:none} }

/* ---------- page + right-hand topic rail ---------- */
.page{position:relative;margin:0 0 26px;display:flex;align-items:flex-start;gap:12px}
.pframe{position:relative;display:inline-block;line-height:0}
/* width-capped as well as height-capped, so a narrow screen scales the page down
   instead of cropping it (the lanes deliberately do not pan sideways) */
.pframe.htmlpage{height:86vh;aspect-ratio:210/294;overflow:hidden;background:#fff;
 box-shadow:0 10px 34px rgba(0,0,0,.45)}
.pframe.htmlpage iframe{width:210mm;height:297mm;border:0;position:absolute;top:0;left:0;transform-origin:top left;background:#fff}
/* a spread: two facing pages shown as one sheet (issue record: "spreads":[[4,5]]) */
.spread{display:flex;gap:0;line-height:0;box-shadow:0 10px 34px rgba(0,0,0,.45)}
/* flex:0 0 auto: without it the two pages shrink to fit the row while the
   documents inside keep their size, which is what put scrollbars on them */
.spread .pframe.htmlpage{box-shadow:none;flex:0 0 auto;overflow:hidden}
.lk{position:absolute;display:block;border-radius:2px;background:rgba(255,212,0,0);transition:background .12s,box-shadow .12s}
.pframe:hover .lk{background:rgba(255,212,0,.16);box-shadow:0 0 0 1px rgba(255,212,0,.5) inset}

.page img.pp{max-height:86vh;max-width:100%;background:#fff;box-shadow:0 10px 34px rgba(0,0,0,.45);display:block}
.rail{width:150px;flex:0 0 150px;padding-top:6px}
body.tagging .rail{width:250px;flex:0 0 250px}
.palette{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px;max-height:118px;overflow:auto}

/* EDITOR GATE: readers get a clean viewer. Open with ?edit appended to the URL to reveal

const EDITOR=(function(){ try{

const KEY='abk_tags_v1';
const ZSTEPS=[50,60,70,80,90,100,110,125,150,175,200];
let ZOOM=(function(){ try{ const v=parseInt(localStorage.getItem('abk_zoom'),10);
  return ZSTEPS.indexOf(v)>=0 ? v : 100; }catch(e){ return 100; } })();
function setZoom(p){
  ZOOM=p;
  try{ localStorage.setItem('abk_zoom',String(p)); }catch(e){}
  const el=document.getElementById('zval'); if(el) el.textContent=p+'%';

function zoomStep(d){
  let i=ZSTEPS.indexOf(ZOOM); if(i<0) i=ZSTEPS.indexOf(100);
  i=Math.max(0,Math.min(ZSTEPS.length-1,i+d));
  setZoom(ZSTEPS[i]);
}

const A4W=210*96/25.4, A4H=294*96/25.4;       /* the ABK page: 210 x 294 mm */
/* the page size of the issue a page document belongs to (html/<issue>/N.html), in CSS px */
function pageWH(el){ const m=/(?:^|\/)html\/([^\/]+)\//.exec((el&&el.getAttribute('src'))||''); const i=m&&byId(m[1]);
  return (i&&i.pw&&i.ph)?[i.pw*96/25.4,i.ph*96/25.4]:[A4W,A4H]; }       /* A4 in CSS px */
function availWidth(el){
  const row=el.closest('.page')||el.parentElement, sheet=el.closest('.sheet');
  let w=window.innerWidth;
  if(sheet){
    const cs=getComputedStyle(sheet);
    w=sheet.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
  }
  if(row){
    const stacked=getComputedStyle(row).flexDirection==='column';
    const rail=row.querySelector('.rail');
    if(rail && !stacked){
      w-=rail.getBoundingClientRect().width;
      w-=parseFloat(getComputedStyle(row).columnGap||getComputedStyle(row).gap||12)||12;
    }
  }
  return Math.max(140,w);
}
/* 100% means the page at its true printed size, so body type reads the size it
   does on paper. Only a window too narrow for a full-width page shrinks it. */
function fitFrames(){
  requestAnimationFrame(function(){
    document.querySelectorAll('.pframe.htmlpage').forEach(function(fr){
      const ifr=fr.querySelector('iframe'); if(!ifr) return;
      const WH=pageWH(ifr), A4W=WH[0], A4H=WH[1];          /* this issue's page */
      const sp=fr.closest('.spread');
      const across=sp?2:1;                                 /* a spread fits two pages in the row */
      /* gut: the share of a page's width taken up by the unprinted gutter margin.
         Trimming it off the inner edge of each page lets the two halves meet, so
         the artwork reads across the join instead of being split by a white band. */
      const gut=sp?(parseFloat(sp.dataset.gut)||0)/100:0;
      const base=Math.min(1, availWidth(fr)/(A4W*across*(1-gut)));
      const k=base*(ZOOM/100);
      fr.style.width=(A4W*k*(1-gut))+'px';                 /* the visible, trimmed width */
      fr.style.height=(A4H*k)+'px';
      /* no transform on the iframe: the page draws itself at this size, so type stays sharp at any zoom */
      ifr.style.width=(A4W*k)+'px'; ifr.style.height=(A4H*k)+'px'; ifr.style.transform='none'; ifr.dataset.k=k;
      /* the left-hand page is trimmed on its right, so it simply overflows the box;
         the right-hand page is trimmed on its left, so slide it back by that much */
      ifr.style.left=fr.classList.contains('gutL')?(-(A4W*k*gut))+'px':'0px';
      try{ ifr.contentWindow.postMessage({abk:'zoom',k:k},'*'); }catch(e){}
      /* A page that has not loaded yet never hears that message, and a page that
         is drawn at the wrong size overflows its frame and grows scrollbars. So
         tell it again the moment it loads, once per iframe. */
      if(!ifr.dataset.bound){
        ifr.dataset.bound='1';
        ifr.addEventListener('load',function(){
          try{ ifr.contentWindow.postMessage({abk:'zoom',k:parseFloat(ifr.dataset.k)||1},'*'); }catch(e){}
        });
      }
    });
    document.querySelectorAll('.page img.pp').forEach(function(im){
      const base=Math.min(1, availWidth(im.closest('.pframe')||im)/A4W);
      im.style.maxHeight='none'; im.style.maxWidth='none';
      im.style.width=(A4W*base*(ZOOM/100))+'px';
      im.style.height='auto';
    });
  });
}
window.addEventListener('resize',fitFrames);
/* a page that has just loaded says hello; answer with the size it should draw itself at */
window.addEventListener('message',function(e){
  const m=e.data; if(!m||m.abk!=='hello'||!e.source) return;
  let known=false;
  document.querySelectorAll('iframe').forEach(function(f){
    if(f.contentWindow!==e.source) return;
    if(f.dataset.k){ known=true; try{ e.source.postMessage({abk:'zoom',k:parseFloat(f.dataset.k)},'*'); }catch(err){} }
  });
  /* it said hello before we ever sized it: size everything now and it will be
     told in the same pass, instead of being left drawing itself at full size */
  if(!known) fitFrames();
});
function splitAuthors(s){
  if(!s) return [];
  const PROTECT=[/,\s*(Davis|Jr\.?|Sr\.?|PhD|Ph\.D\.?|MD|Inc\.?|Ltd\.?)$/i];
  for(const rx of PROTECT){ if(rx.test(s)) return [s.trim()]; }
  return s.split(',').map(x=>x.trim()).filter(Boolean);
}
function hasAuthor(a,name){ return splitAuthors(a.author||'').some(x=>x.toLowerCase()===name.toLowerCase()); }
function knownTags(){ const s=new Set(); allArts().forEach(a=>a.tags.forEach(t=>s.add(t)));
  return [...s].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())); }
function knownAuthors(){ const s=new Set(); allArts().forEach(a=>splitAuthors(a.author||'').forEach(x=>s.add(x)));
  return [...s].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())); }
function addTag(id,t){ const el=document.getElementById(id); if(!el) return;
  const cur=el.value.split(',').map(x=>x.trim()).filter(Boolean);
  if(cur.some(x=>x.toLowerCase()===t.toLowerCase())){ el.focus(); return; }
  cur.push(t); el.value=cur.join(', '); el.focus(); }

/* "Share this issue": a link that opens the reader at this issue's cover (Kris, 21 Nov 2026) */
function copyIssue(id){
  const it=byId(id)||{};
  const local=(location.protocol==='file:');
  const dir=local ? 'https://krisfricke.github.io/abk/' : location.href.split('#')[0].replace(/[^\/]*$/,'');
  const u=dir+'#/issue/'+id;
  const what=(it.label||'this issue')+(it.vol?' ('+it.vol+')':'');
  const note = local ? '\n\nNote: you are reading this from a folder, so the link is not live yet.' : '';
  navigator.clipboard.writeText(u).then(
    ()=>alert('Link to '+what+' copied.\n\nAnyone opening it lands on the cover of that issue.\n\n'+u+note),
    ()=>prompt('Copy this link to '+what+':'+note,u)); }
function copyArt(slug){
  const a=findArt(slug);
  /* Always hand out the address the article will have on the web, even when the
     reader is being read from a folder - a file:// path is no use to anyone else. */
  const local=(location.protocol==='file:');
  const dir=local ? 'https://krisfricke.github.io/abk/'
                  : location.href.split('#')[0].replace(/[^\/]*$/,'');
  const u=dir+'article/'+slug+'/';
  const what=a? '“'+a.t+'”' : 'this article';
  const note = local
    ? '\n\nNote: you are reading this from a folder, so the link is not live yet.'

  navigator.clipboard.writeText(u).then(
    ()=>alert('Link to '+what+' copied.\n\nAnyone opening it lands on page '+(a?a.p:'')+' of '+(a?(byId(a.issue)||{}).label:'the issue')+'.\n\n'+u+note),
    ()=>prompt('Copy this link to '+what+':'+note,u)); }
/* The '#text' matters. Article pages forward themselves back into the reader
   unless they see a hash (or the sticky abk_nofwd flag), so without it you land
   on the text page and are bounced straight out again. The hash is the polite
   way to say "I meant to come here": it affects this visit only, where the
   sessionStorage flag would stop every article page forwarding for the rest of

function openText(slug){ location.href='article/'+slug+'/index.html#text'; }

function esc(x){return (x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- article records for an issue: overrides win, else baked data ---- */
function issueArts(iss){
  const out=[];
  Object.keys(OV).forEach(function(k){
    const pr=k.split(':'); if(pr[0]!==iss) return;
    (OV[k]||[]).forEach(a=>out.push({issue:iss,p:+pr[1],end:a.end||+pr[1],t:a.t,author:a.author||'',tags:a.tags||[],skip:a.skip||[]}));
  });
  D.arts.filter(a=>a.issue===iss).forEach(function(a){
    if(OV[iss+':'+a.p]) return;                       /* page overridden */
    out.push({issue:iss,p:a.p,end:a.end||a.p,t:a.t,author:a.author||'',tags:a.tags||[],skip:a.skip||[],slug:a.slug,text:a.text,ad:!!a.ad});
  });
  return out.sort((x,y)=>x.p-y.p);
}
function allArts(){ return D.issues.flatMap(i=>issueArts(i.id)); }

function prevArt(iss,p){ const c=issueArts(iss).filter(a=>a.p<p); return c.length?c[c.length-1]:null; }


/* Records that are pictures rather than prose - covers, ads, the classifieds,
   the index page - have no plain-text version worth offering, and linking to
   one would only 404 or show an empty page. Add a tag here if a new category
   turns up; this is the only place the rule lives. */
const NOTEXT=[];
function hasText(a){ return !!a.text; }   /* set by the build: every article with prose has a text version */

/* the rail beside a page while reading: titles, share, authors and topics for every article on it */
function readRail(act,n,on){
  let rail='<div class="pn">PAGE '+n+' / '+act.pages.length+'</div>';
  on.forEach(function(a){
    if(a.ad){ rail+='<div class="adv">Advertisement</div><div class="ti'+(a.cont?' co':'')+'">'+esc(a.t)+'</div>'; return; }
    const span=(a.end>a.p)?' <span class="sp">pp.'+a.p+'–'+a.end+'</span>':'';
    const sg=a.slug||(a.issue+'-'+slugify(a.t));
    rail+='<div class="ti'+(a.cont?' co':'')+'">'+(a.cont?'↳ ':'')+esc(a.t)+span+'</div>';
    if(!a.cont) rail+='<button class="share" onclick="copyArt(\''+sg+'\')" title="Copy a link straight to this article">Share this article</button>';
    /* index.html spelled out, not just the folder: a file:// directory URL
       shows a listing instead of the page, so this keeps local testing honest */
    if(!a.cont && hasText(a)) rail+='<a class="txt" href="article/'+sg+'/index.html#text" onclick="openText(\''+sg+'\');return false" title="Read this article as reflowable text">Read as text</a>';
    if(a.cont) rail+='<div class="cofrom">continued from p.'+a.p+'</div>';
    splitAuthors(a.author).forEach(function(au){
      rail+='<button class="au" onclick="openAuthor(\''+au.replace(/'/g,"\\'")+'\')">'+esc(au)+'</button>'; });
    const plants=a.tags.filter(isFlora), rest=a.tags.filter(t=>!isFlora(t));
    rest.forEach(t=>{ rail+='<button class="tg" onclick="openTopic(\''+t.replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>'; });
    if(plants.length){
      rail+='<div class="florawrap">'+
        '<button class="tg flora" onclick="openTopic(\'Flora\')" '+
          'title="'+plants.length+' flowering plants on this page - hover to list them">'+
          'Flora<span class="fc">'+plants.length+'</span></button>'+
        '<div class="floramenu">'+
          plants.map(function(t){
            return '<button class="tg sub" onclick="openTopic(\''+t.replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>';
          }).join('')+
        '</div></div>';
    }
  });
  return rail;
}

function refreshLists(){ const dl=document.getElementById('aulist');
  if(dl) dl.innerHTML=knownAuthors().map(a=>'<option value="'+esc(a)+'">').join(''); }
function build(){
  refreshLists();
  document.body.classList.toggle('tagging',tagMode);
  if(activeId===null){                       /* covers only — nothing opened */
    document.getElementById('issLabel').textContent='All issues';
    const s0=document.getElementById('sheet'); s0.innerHTML='';
    D.issues.forEach(function(it){
      const d=document.createElement('div'); d.className='arc'; d.id='iss-'+it.id;
      d.innerHTML='<img src="'+it.cover+'" alt=""><div class="lab">'+it.label+' · '+it.vol+'</div>'+
        '<button class="go">Read this issue</button><div class="hint">'+it.pages.length+' pages</div>';
      d.onclick=()=>setActive(it.id); s0.appendChild(d);
    });
    return;
  }
  const act=byId(activeId);
  document.getElementById('issLabel').textContent=act.label;
  const s=document.getElementById('sheet'); s.innerHTML='';
  D.issues.filter(i=>i.id!==activeId).forEach(function(it){
    const d=document.createElement('div'); d.className='arc'; d.id='iss-'+it.id;
    d.innerHTML='<img src="'+it.cover+'" alt=""><div class="lab">'+it.label+' · '+it.vol+'</div>'+
      '<button class="go">Read this issue</button><div class="hint">'+it.pages.length+' pages</div>';
    d.onclick=()=>setActive(it.id); s.appendChild(d);
  });
  const c=document.createElement('div'); c.className='cov'; c.id='cover';
  /* cover teasers: boxes over the hero picture that jump to the article (act.teasers, in % of the picture) */
  const tz=(act.teasers||[]).map(t=>'<a class="tz" href="#/page/'+act.id+'/'+t.p+'" title="Go to page '+t.p+'" aria-label="'+esc(t.name||('Go to page '+t.p))+'" style="left:'+t.l+'%;top:'+t.t+'%;width:'+t.w+'%;height:'+t.h+'%"></a>').join('');
  c.innerHTML=(D.issues.length>1?'<div class="hint">▲ scroll up for past issues</div>':'')+'<div class="covpic"><img src="'+act.cover+'" alt="">'+tz+'</div>'+
    '<div class="cap">'+act.label+' · '+act.vol+'</div><button class="share" onclick="copyIssue(\''+act.id+'\')" title="Copy a link that opens this issue at its cover">Share this issue</button><div class="hint">▼ scroll down to read — topics appear beside each page</div>';
  s.appendChild(c);
  c.querySelectorAll('a.tz').forEach(a=>{ a.onclick=function(e){ e.preventDefault(); jumpTo(act.id,parseInt(a.getAttribute('href').split('/').pop(),10)); }; });
  act.pages.forEach(function(file,idx){
    if(idx===0 && !tagMode) return; /* page 1 is the cover — already shown in the pinned hero above; skip the duplicate card while reading */
    const n=idx+1, on=onPage(act.id,n);
    const d=document.createElement('div'); d.className='page'; d.id='p'+n;
    let rail='<div class="pn">PAGE '+n+' / '+act.pages.length+'</div>';
    if(tagMode){
      const carried=on.filter(a=>a.cont);
      const owns=on.filter(a=>!a.cont);
      carried.forEach(function(c){
        rail+='<div class="contbox">↳ continues <b>'+esc(c.t)+'</b><br><span>from page '+c.p+'</span>'+
              '<button class="tg" style="text-align:center;margin-top:6px" onclick="unlinkCont('+n+','+c.p+')">break continuation</button></div>';
      });
      if(!carried.length){
        const pv=prevArt(act.id,n);
        if(pv) rail+='<button class="cont" onclick="markCont('+n+')">↳ continues “'+esc(pv.t.slice(0,22))+'” (p.'+pv.p+')</button>';
      }
      const extra=(OV[activeId+':'+n]&&OV[activeId+':'+n].__add)?1:0;
      const slots=Math.max(1,owns.length+extra);
      if(carried.length) rail+='<div class="slotsep">also starting on this page</div>';
      for(let si=0;si<slots;si++){
        const a2=owns[si];
        if(si&&!carried.length) rail+='<div class="slotsep">another article on this page</div>';
        if(si&&carried.length) rail+='<div class="slotsep">another article on this page</div>';
        rail+='<input class="ed" id="ti'+n+'_'+si+'" placeholder="article title" value="'+(a2?esc(a2.t):'')+'">'+
              '<input class="ed" id="au'+n+'_'+si+'" list="aulist" placeholder="author(s), comma separated" value="'+(a2?esc(a2.author):'')+'">'+
              '<input class="ed" id="tg'+n+'_'+si+'" placeholder="tags, comma separated" value="'+(a2?esc(a2.tags.join(', ')):'')+'">'+
              '<div class="palette">'+knownTags().map(function(t){
                 return '<button class="pchip" onclick="addTag(\'tg'+n+'_'+si+'\',\''+t.replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>';
               }).join('')+'</div>';
      }
      rail+='<button class="tg" style="text-align:center" onclick="saveTag('+n+','+slots+')">save</button>'+
            '<button class="tg addslot" style="text-align:center" onclick="addSlot('+n+')">+ another article on this page</button>';
    } else {
      rail=readRail(act,n,on);
    }
    const isHTML=(act.html||[]).indexOf(n)>=0 && !tagMode;
    /* facing pages listed in act.spreads are shown together as one sheet; the
       second page of a pair gets no card of its own but keeps its id for jumps */
    const sp=(act.spreads||[]).find(q=>q[0]===n||q[1]===n);
    if(sp && isHTML && (act.html||[]).indexOf(sp[1])>=0){
      if(n===sp[1]) return;
      const m=sp[1];
      const gut=sp[2]||0;      /* % of page width to trim off each inner edge */
      d.innerHTML='<div class="spread" data-gut="'+gut+'">'+
        '<div class="pframe htmlpage gutR"><iframe loading="lazy" scrolling="no" title="'+act.label+' page '+n+'" src="html/'+act.id+'/'+n+'.html?v='+D.v+'\"></iframe></div>'+
        '<div class="pframe htmlpage gutL" id="p'+m+'"><iframe loading="lazy" scrolling="no" title="'+act.label+' page '+m+'" src="html/'+act.id+'/'+m+'.html?v='+D.v+'\"></iframe></div>'+
        '</div><div class="rail">'+rail.replace('PAGE '+n+' /','PAGES '+n+'–'+m+' /')+'</div>';
      s.appendChild(d); fitFrames(); return;
    }
    if(isHTML){
      d.innerHTML='<div class="pframe htmlpage"><iframe loading="lazy" scrolling="no" title="'+act.label+' page '+n+'" src="html/'+act.id+'/'+n+'.html?v='+D.v+'\"></iframe>'+
        '</div><div class="rail">'+rail+'</div>';
      s.appendChild(d); fitFrames(); return;
    }
    const ln=(LINKS[act.id]&&LINKS[act.id][n])||[];
    let spots='';
    if(!tagMode) ln.forEach(function(z){
      const st='left:'+z.l+'%;top:'+z.t+'%;width:'+z.w+'%;height:'+z.h+'%';
      spots += z.u ? '<a class="lk" style="'+st+'" href="'+z.u.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener" title="'+z.u.replace(/"/g,'&quot;')+'"></a>'
                   : '<a class="lk in" style="'+st+'" onclick="jumpTo(\''+act.id+'\','+z.p+');return false" title="go to page '+z.p+'"></a>';
    });
    d.innerHTML='<div class="pframe"><img class="pp" src="assets/'+act.dir+'/'+file+'" loading="lazy" alt="page '+n+'">'+spots+
      (ln.length&&!tagMode?'<span class="lkbadge">'+ln.length+' link'+(ln.length==1?'':'s')+'</span>':'')+
      '</div><div class="rail">'+rail+'</div>';
    s.appendChild(d);
  });
}

/* ---------------- sideways lanes ---------------- */
function lane(title,sub,hits){
  const ts=document.getElementById('topsheet');
  ts.innerHTML='<div class="tophead"><h2>'+esc(title)+'</h2><div class="sub">'+sub+'</div>'+
    '<button class="back" onclick="closeTopic()">‹ back to the issue</button></div>';
  if(!hits.length) ts.innerHTML+='<div class="empty">Nothing here yet.</div>';
  hits.forEach(function(a){
    const iss=byId(a.issue);
    const pages=(a.end>a.p)?('pages '+a.p+'–'+a.end):('page '+a.p);
    const head=document.createElement('div'); head.className='tstoryhead';
    head.innerHTML='<b>'+esc(a.t)+'</b>'+(a.author?' · '+esc(a.author):'')+' — '+iss.label+', '+pages+
      '<a onclick="jumpTo(\''+a.issue+'\','+a.p+')">open in issue ›</a>';
    ts.appendChild(head);
    for(let p=a.p; p<=(a.end||a.p); p++){
      const f=iss.pages[p-1]; if(!f) continue;
      if((a.skip||[]).indexOf(p)>=0) continue;
      if((iss.html||[]).indexOf(p)>=0){
        /* the same live page as in the issue - selectable text, links, footnotes - with its rail of topics */
        const d=document.createElement('div'); d.className='page';
        d.innerHTML='<div class="pframe htmlpage"><iframe loading="lazy" scrolling="no" title="'+esc(a.t)+' — page '+p+'" src="html/'+iss.id+'/'+p+'.html?v='+D.v+'\"></iframe></div>'+
          '<div class="rail">'+readRail(iss,p,onPage(iss.id,p))+'</div>';
        ts.appendChild(d); continue;
      }
      const d=document.createElement('div'); d.className='tcard';
      d.innerHTML='<img src="assets/'+iss.dir+'/'+f+'" loading="lazy" alt="'+esc(a.t)+' — page '+p+'">';
      d.querySelector('img').onclick=(function(pp){return ()=>jumpTo(a.issue,pp);})(p);
      ts.appendChild(d);
    }
  });
  document.getElementById('lane1').scrollTop=0;
  setLane(1); fitFrames();
}

/* ---------- browse by author / topic ---------- */
var BMODE='author';
function isOrg(n){
  var s=String(n||'');
  if(/\b(foundation|association|university|institute|council|department|agriculture|society|group|committee|sub-?committee|subcommittee|board|program|programme|authority|centre|center|network|federation|cooperative|journal|media|news|services|industries|australia|victoria|pty|ltd|inc)\b/i.test(s)) return true;
  if(s.replace(/[^A-Za-z]/g,'').length>1 && s===s.toUpperCase()) return true;  /* AHBIC, CSIRO, APVMA */
  return false;
}
/* People file under surname; organisations file under their own first word. */
function surname(n){
  var s=String(n||'').trim().replace(/\s+/g,' ');
  if(isOrg(s)) return s.toLowerCase().replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
  var suff=/^(jr\.?|sr\.?|phd|ph\.d\.?|md|inc\.?|ltd\.?|i{1,3}|iv)$/i;
  var p=s.split(' ').filter(Boolean);
  while(p.length>1 && suff.test(p[p.length-1])) p.pop();
  return (p.length?p[p.length-1]:s).toLowerCase().replace(/[^a-z]/g,'');
}
function authorIndex(){
  var m={};
  allArts().forEach(function(a){
    splitAuthors(a.author||'').forEach(function(n){
      n=n.trim(); if(!n) return;
      var k=n.toLowerCase();
      if(!m[k]) m[k]={name:n,n:0};
      m[k].n++;
    });
  });
  return Object.keys(m).map(function(k){return m[k];})
    .sort(function(x,y){
      var a=surname(x.name), b=surname(y.name);
      return a<b?-1:a>b?1:x.name.localeCompare(y.name);
    });
}
function topicIndex(){
  var m={};
  allArts().forEach(function(a){ expandTags(a.tags||[]).forEach(function(t){
    t=String(t).trim(); if(!t) return;
    var k=t.toLowerCase(); if(!m[k])m[k]={name:t,n:0}; m[k].n++;
  });});
  return Object.keys(m).map(function(k){return m[k];})
    .sort(function(x,y){return x.name.toLowerCase().localeCompare(y.name.toLowerCase());});
}
function openBrowse(mode){
  BMODE=mode;
  document.getElementById('btitle').textContent = mode==='author'?'Search by author':'Search by topic';
  var fi=document.getElementById('bfind');
  fi.value=''; fi.placeholder = mode==='author'?'Type a name…':'Type a topic…';
  document.getElementById('bscrim').classList.add('on');
  renderBrowse();
  setTimeout(function(){fi.focus();},30);
}
function closeBrowse(){ document.getElementById('bscrim').classList.remove('on'); }
function renderBrowse(){
  var items=(BMODE==='author')?authorIndex():topicIndex();
  var q=document.getElementById('bfind').value.trim().toLowerCase();
  var flora=[];
  if(BMODE==='topic'){
    flora=items.filter(function(i){return isFlora(i.name);});
    items=items.filter(function(i){return !isFlora(i.name);});
    if(flora.length){
      var ex=items.filter(function(i){return nkey(i.name)==='flora';})[0];
      if(ex){ ex.kids=flora; }
      else{ var n=0; flora.forEach(function(f){n+=f.n;});
            items.push({name:'Flora',n:n,kids:flora}); }
      items.sort(function(x,y){return x.name.toLowerCase().localeCompare(y.name.toLowerCase());});
    }
  }
  if(q){
    items=items.filter(function(i){
      if(i.name.toLowerCase().indexOf(q)>-1) return true;
      return i.kids && i.kids.some(function(k){return k.name.toLowerCase().indexOf(q)>-1;});
    });
  }
  document.getElementById('bcount').textContent=items.length+(BMODE==='author'?' authors':' topics');
  if(!items.length){ document.getElementById('blist').innerHTML='<div class="bnone">Nothing matches that.</div>'; return; }
  var html='',cur='';
  items.forEach(function(i){
    var key=(BMODE==='author'?surname(i.name):i.name.toLowerCase()).charAt(0).toUpperCase()||'#';
    if(key!==cur){ if(cur)html+='</div>'; html+='<div class="bletter">'+key+'</div><div class="bcols">'; cur=key; }
    if(i.kids){
      var open=(q||FLORA_OPEN)?' open':'';
      html+='<div class="bgrp'+open+'" id="floragrp">'+
        '<button class="brow bparent" onclick="toggleFlora(event)">'+
          '<span class="tw"></span>'+esc(i.name)+'<span class="n">'+i.kids.length+' plants</span></button>'+
        '<div class="bkids">'+
          i.kids.map(function(k){
            return '<button class="brow bkid" onclick="pickBrowse('+JSON.stringify(k.name).replace(/"/g,'&quot;')+')">'+
                   esc(k.name)+'<span class="n">'+k.n+'</span></button>';
          }).join('')+
        '</div></div>';
    } else {
      html+='<button class="brow" onclick="pickBrowse('+JSON.stringify(i.name).replace(/"/g,'&quot;')+')">'+
            esc(i.name)+'<span class="n">'+i.n+'</span></button>';
    }
  });
  if(cur)html+='</div>';
  document.getElementById('blist').innerHTML=html;
}

/* ---------------- canonical tag / author normalisation ----------------
   Runs over BOTH the built-in data and anything saved in localStorage, so a
   variant typed during tagging is corrected wherever it lives, once, on load. */
function nkey(s){ return String(s||'').replace(/[’‘`]/g,"'").toLowerCase().replace(/\s+/g,' ').trim(); }
var TAGFIX={};
var AUTHFIX={"liz frost": "Elizabeth Frost"};
function canonTags(tags){
  var out=[],seen={};
  (tags||[]).forEach(function(t){
    var rep=TAGFIX[nkey(t)];
    (rep!==undefined?rep:[t]).forEach(function(x){
      var k=nkey(x); if(!k||seen[k])return; seen[k]=1; out.push(x);
    });
  });
  return out;
}
function canonAuthor(a){
  var parts=splitAuthors(a||'').map(function(n){
    var k=nkey(n); return AUTHFIX[k]!==undefined?AUTHFIX[k]:n;
  }).filter(function(x){return x&&x.trim();});
  return parts.join(', ');
}
function normaliseAll(){
  var changed=false;
  D.arts.forEach(function(a){
    var t=canonTags(a.tags), au=canonAuthor(a.author||'');
    if(JSON.stringify(t)!==JSON.stringify(a.tags)) a.tags=t;
    if(au!==(a.author||'')) a.author=au;
  });
  Object.keys(OV).forEach(function(k){
    (OV[k]||[]).forEach(function(a){
      var t=canonTags(a.tags||[]), au=canonAuthor(a.author||'');
      if(JSON.stringify(t)!==JSON.stringify(a.tags||[])){ a.tags=t; changed=true; }
      if(au!==(a.author||'')){ a.author=au; changed=true; }
    });
  });
  if(changed) saveOV();     /* corrections stick, so the export is clean too */
}

var FLORA=['Banksia','Black box','Capeweed','Clover','Grey box','Longleaf box','Red box','Red gum',
 'Red ironbark','Red stringybark','Stringybark','White mallee','Yellow box','Yellow gum','Yellow mallee',
 'Manna gum','Messmate','Spotted gum','Sugar gum','Blue gum','Ironbark','Mallee','Paterson’s curse',
 'Salvation Jane','Canola','Lucerne','Wattle','Tea tree','Bottlebrush','Grevillea','Eucalyptus'];
function isFlora(t){ var k=nkey(t); return FLORA.some(function(f){return nkey(f)===k;}); }

/* ---------------- tagging ---------------- */
function keepScroll(fn){ const y=document.getElementById('lane0').scrollTop; fn(); build();
  document.getElementById('lane0').scrollTop=y; }
function toggleTag(){ if(!EDITOR) return; tagMode=!tagMode; document.getElementById('tabTag').classList.toggle('on',tagMode);
  keepScroll(()=>{});
  if(tagMode) alert('Tag mode on.\n\n• Fill in title, author and tags, then Save.\n• On a page that carries on the previous article, press “↳ continues …” — it extends that article rather than duplicating it.\n\n“Export tags” downloads the file; send it to me to bake in.'); }
function saveTag(n,slots){
  const k=activeId+':'+n; const ex=(OV[k]&&OV[k][0])||{};
  const rows=[];
  for(let si=0;si<(slots||1);si++){
    const ti=document.getElementById('ti'+n+'_'+si), au=document.getElementById('au'+n+'_'+si), tg=document.getElementById('tg'+n+'_'+si);
    if(!ti) continue;
    const t=ti.value.trim(), a=au.value.trim(), g=tg.value.split(',').map(x=>x.trim()).filter(Boolean);
    if(!t&&!a&&!g.length) continue;
    rows.push({t:t||('Page '+n),author:a,tags:g,end:si===0?(ex.end||n):n});
  }
  keepScroll(function(){ if(!rows.length) delete OV[k]; else OV[k]=rows; saveOV(); });
}
function addSlot(n){ const k=activeId+':'+n; if(!OV[k]) OV[k]=[];
  OV[k].__add=true; keepScroll(function(){}); }
function markCont(n){                       /* extend the previous article's span to cover page n */
  const pv=prevArt(activeId,n); if(!pv) return;
  const k=activeId+':'+pv.p;
  keepScroll(function(){ OV[k]=[{t:pv.t,author:pv.author,tags:pv.tags,end:Math.max(n,pv.end||pv.p)}]; saveOV(); });
}
function unlinkCont(n,startP){
  const carried=onPage(activeId,n).filter(a=>a.cont&&(!startP||a.p===startP))[0]; if(!carried) return;
  const k=activeId+':'+carried.p;
  keepScroll(function(){ OV[k]=[{t:carried.t,author:carried.author,tags:carried.tags,end:n-1}]; saveOV(); });
}
function exportTags(){
  const rows=allArts().map(a=>({issue:a.issue,p:a.p,end:a.end,t:a.t,author:a.author,tags:a.tags}));
  const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),articles:rows},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ABK_tags.json'; a.click();
}
/* ---------------- routing ---------------- */
function route(){ const h=location.hash;
  if(h.startsWith('#/article/')){ const a=findArt(h.slice(10));
    if(a){ setLane(0); if(activeId!==a.issue){activeId=a.issue;build();}
      setTimeout(()=>{const e=document.getElementById('p'+a.p); if(e)e.scrollIntoView({behavior:'smooth'});},260);} return; }
  if(h.startsWith('#/page/')){ const q=h.slice(7).split('/');
    const iss=q[0], pn=parseInt(q[1],10);
    if(byId(iss)&&pn){ setLane(0); jumpTo(iss,pn); }
    history.replaceState(null,'',location.pathname+location.search);   /* re-clickable */
    return; }
  if(h.startsWith('#/topic/')){ openTopic(decodeURIComponent(h.slice(8))); return; }
  if(h.startsWith('#/author/')){ openAuthor(decodeURIComponent(h.slice(9))); return; }
  if(h==='#/topics'){ openBrowse('topic'); return; }
  if(h==='#/issues'){ if(activeId!==null){activeId=null;build();} closeTopic(); return; }
  if(h.startsWith('#/issue/')){ const id=h.slice(8); if(byId(id)&&id!==activeId){activeId=id;build();}
    closeTopic(); requestAnimationFrame(()=>document.getElementById('cover').scrollIntoView()); return; }
  closeTopic(); }
if(EDITOR) document.body.classList.add('editor');
/* Past issues and the topic browser only appear once there is something in them */
if(D.issues.length<2){ ['navIssues','introPast'].forEach(function(id){ var e=document.getElementById(id); if(e) e.style.display='none'; }); }
if(!D.arts.some(function(a){ return (a.tags||[]).length; }) && !Object.keys(OV).length){ var nt=document.getElementById('navTopics'); if(nt) nt.style.display='none'; }
try{ normaliseAll(); }catch(e){ console.warn('tag normalisation skipped:',e); }
setZoom(ZOOM);
build();
window.addEventListener('keydown',function(e){
  if(/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||'')) return;
  const t=document.getElementById('track');
  if(e.key==='ArrowLeft'){ setLane(t.classList.contains('right')?0:-1); }
  if(e.key==='ArrowRight'&&!t.classList.contains('right')){ if(t.classList.contains('left')) setLane(0); }
  if(e.key==='Escape') setLane(0);
});
/* ---------- picture lightbox ---------- */
(function(){
  const lb=document.createElement('div'); lb.id='lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');
  lb.innerHTML='<button class="close" aria-label="Close">×</button><div class="pic"><img alt=""></div><div class="bar"><span class="cap"></span><button class="ans" style="display:none">Show the answers</button><button class="x">Close</button></div>';
  document.body.appendChild(lb);
  const img=lb.querySelector('img'), pic=lb.querySelector('.pic'), cap=lb.querySelector('.cap'), ans=lb.querySelector('.ans');
  function close(){ lb.classList.remove('on','answers'); img.src=''; pic.querySelectorAll('.ring').forEach(r=>r.remove()); }
  lb.querySelector('.close').onclick=close; lb.querySelector('.x').onclick=close;
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
  window.addEventListener('keydown',e=>{ if(e.key==='Escape'&&lb.classList.contains('on')) close(); });
  ans.onclick=function(){ const on=lb.classList.toggle('answers'); ans.textContent=on?'Hide the answers':'Show the answers'; };
  window.addEventListener('message',function(e){
    const m=e&&e.data; if(!m||m.abk!=='img'||!m.src) return;
    close();
    img.src=m.src; img.alt=m.alt||''; cap.textContent=m.cap||m.alt||'';
    if(m.answers&&m.answers.length){
      ans.style.display=''; ans.textContent='Show the answers';
      m.answers.forEach(a=>{ const r=document.createElement('div'); r.className='ring';
        r.style.left=a.x+'%'; r.style.top=a.y+'%'; r.style.width=(a.r*2)+'%'; r.style.paddingTop=(a.r*2)+'%'; r.style.height='0';
        /* the ring is sized against the picture's width; paddingTop keeps it round */
        pic.appendChild(r); });
    } else ans.style.display='none';
    lb.classList.add('on');
  });
})();
/* page documents live in iframes; they ask the reader to move rather than
   navigating, which also works from a local folder where file:// will not
   serve a directory's index.html */
window.addEventListener('message',function(e){
  const m=e&&e.data;
  if(!m||m.abk!=='page') return;
  const iss=String(m.iss||''), p=parseInt(m.p,10);
  const issue=byId(iss);
  if(!issue||!p||p<1||p>issue.pages.length) return;
  setLane(0); jumpTo(iss,p);
});

/* ---------- bee follower ---------- */
/* Pages ask which pointer to draw ({abk:'cursor?'}), and are told again whenever one loads. */
(function(){
  var kind=window.ABK_CURSOR||'shard';
  function tell(w){ try{ w.postMessage({abk:'cursor',kind:kind},'*'); }catch(e){} }
  window.addEventListener('message',function(e){ var m=e.data; if(m&&(m.abk==='cursor?'||m.abk==='hello')&&e.source) tell(e.source); });
  document.addEventListener('load',function(e){ var t=e.target; if(t&&t.tagName==='IFRAME'&&t.contentWindow) tell(t.contentWindow); },true);
})();
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;                 /* touch: keep the finger */
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const bee=document.getElementById('beecur'); if(!bee) return;
  if(window.ABK_CURSOR==='shard'){ bee.remove(); return; }                          /* the shard is the pointer: she stays home */
  document.body.classList.add('bee-on');
  /* Phones lie about hover: Android Chrome, a paired stylus and any "desktop site" tab all report
     hover:hover, and the bee then hangs in the middle of a screen with no pointer. Require a FINE
     pointer too, and let actual input decide - a finger suppresses her, a mouse brings her back. */
  let dead=false, exiting=false;
  /* she does not blink out of existence: she flies off to the left and is gone */
  function suppress(){ if(dead||exiting) return;
    if(!bee.classList.contains('on')){ dead=true; document.body.classList.remove('bee-on'); return; }
    exiting=true; document.body.classList.remove('bee-on'); }
  function allow(){ if(!dead&&!exiting) return; dead=false; exiting=false; document.body.classList.add('bee-on'); }
  addEventListener('touchstart',suppress,{passive:true,capture:true});
  addEventListener('touchmove',suppress,{passive:true,capture:true});
  if(window.PointerEvent){
    addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') suppress(); else allow(); },{passive:true,capture:true});
    addEventListener('pointermove',e=>{ if(e.pointerType==='touch') suppress(); else allow(); },{passive:true,capture:true});
  }

  let tx=innerWidth/2, ty=innerHeight/2, x=tx, y=ty, ta=0, a=0, started=false;
  /* landing: hold still for 2s over something solid and she settles; any movement and she is airborne again */
  const SKY='html,body,.track,.lane,.sheet,.cov,.arc,.iscrim,.bscrim,.rail,.pn,.palette';
  const SURF='iframe,.pframe,.chrome,.tophead,.edge,.zoombar,.ibox,.bpanel,.tcard,.tstoryhead,img,button,a,input,.rail .ti';
  let landT=null, landed=false;
  function onSurface(){
    const el=document.elementFromPoint(tx,ty); if(!el) return false;
    if(el.closest(SURF)) return true;
    for(let e=el; e && !e.matches(SKY); e=e.parentElement){
      const bg=getComputedStyle(e).backgroundColor;
      if(bg && bg!=='transparent' && !/^rgba\(.*,\s*0\)$/.test(bg)) return true;   /* anything painted counts as ground */
    }
    return false;
  }
  function land(){ landT=null; if(bee.classList.contains('on') && onSurface()){ landed=true; bee.classList.add('landed'); } }
  function takeoff(){ if(landed){ landed=false; bee.classList.remove('landed'); bee.classList.remove('perched'); } }
  function rearm(){ clearTimeout(landT); landT=setTimeout(land,2000); }

  /* She also settles the instant she is over something clickable: the real
     pointer is hidden, so the folded wings are the only cue that a thing can
     be clicked - the equivalent of the hand cursor.
     The big page targets (.arc, .cov) are deliberately NOT in this list. They
     cover most of the screen, so including them leaves her folded the whole
     time she is over the stack, which reads as broken rather than helpful. */
  const FOLD='a[href],button,[role="button"],.plink,.brow,.tg,.au,.share,.txt';
  function clickableAt(){
    const el=document.elementFromPoint(tx,ty);
    return !!(el && el.closest && el.closest(FOLD));
  }
  /* 'perched', not 'landed': same pose, but the fast transition, because this
     one has to keep up with the pointer rather than settle gracefully. */
  function perch(){ clearTimeout(landT); landT=null;
    if(!landed && bee.classList.contains('on')){ landed=true; bee.classList.add('perched'); } }

  function aim(nx,ny,link){ if(dead||exiting) return;
    const dx=nx-tx, dy=ny-ty; tx=nx; ty=ny;
    if(!started){ x=tx; y=ty; started=true; }
    if(dx*dx+dy*dy>6) ta=Math.atan2(dy,dx)*180/Math.PI+90;       /* head leads the way */
    bee.classList.add('on');
    /* Pages report their own hit test (link); elsewhere we test the document
       under her. Deliberately checked BEFORE the movement threshold: coming to
       rest on a link should still fold her, and sub-pixel moves should not
       shake her loose. */
    if(foraging){ perch(); return; }                                /* on the flower: stay put, keep working */
    if(link===undefined ? clickableAt() : !!link){ perch(); return; }
    if(dx*dx+dy*dy>1){ takeoff(); rearm(); }
  }
  /* Foraging. A page reports that the pointer is over a flower's anthers (message {abk:'forage'}).
     She perches at once and works the flower: a wiggle, a few specks, and her pollen baskets fill
     over about four seconds. The load stays on her legs for the rest of the visit. */
  let foraging=false, forageT=null, pollen=0, mode='gather';
  /* mode 'gather' on a flower fills the baskets; mode 'unload' over comb (the hive) empties them. */
  function forageOn(m){ m=m||'gather'; if(foraging&&m===mode) return; if(foraging) forageOff(); if(dead||exiting) return;
    foraging=true; mode=m; perch(); bee.classList.add('foraging'); bee.classList.toggle('unloading',m==='unload'); bee.classList.toggle('spent',m==='unload'&&pollen===0);
    forageT=setInterval(function(){
      pollen=(m==='unload') ? Math.max(0,pollen-0.06) : Math.min(1,pollen+0.05);
      bee.style.setProperty('--pollen',pollen.toFixed(2));
      if(m==='unload'&&pollen===0) bee.classList.add('spent');           /* baskets empty: she sits and looks, no more specks */
    },200); }
  function forageOff(){ if(!foraging) return; foraging=false; bee.classList.remove('foraging','unloading','spent'); clearInterval(forageT); forageT=null; }
  function hide(){ bee.classList.remove('on'); forageOff(); takeoff(); clearTimeout(landT); landT=null; }

  /* Scrolling turns her to face the way the reading is going: up the issue and
     she points up the screen, down the issue and she points down. The pointer
     is not moving while you scroll, so without this she hangs at whatever angle
     she last flew in at, which reads as her being dragged along backwards.
     Direction comes from the scrolling element, not from the wheel, because the
     wheel event lands inside the page iframe (which cannot scroll itself, so the
     lane scrolls instead) and would never reach this document. A scroll event
     does, in the capture phase, from whichever element actually moved. */
  const UP=0, DOWN=180;                 /* the artwork points up at 0deg */
  const tops=new WeakMap();
  let scrollTa=null, scrollT=null;
  function scrolled(el){
    const now=(el===document||el===window||el===document.documentElement)
      ? (window.scrollY||document.documentElement.scrollTop||0) : el.scrollTop;
    const was=tops.get(el);
    tops.set(el, now);
    if(was===undefined || now===was) return;
    scrollTa = now>was ? DOWN : UP;
    clearTimeout(scrollT);
    /* hold the heading a beat after the last scroll event so she does not
       flick back mid-gesture between the steps of one wheel spin */
    scrollT=setTimeout(function(){ scrollTa=null; },260);
  }
  document.addEventListener('scroll',function(e){ scrolled(e.target===document?document:e.target); },
    {capture:true,passive:true});
  document.addEventListener('mousemove',e=>aim(e.clientX,e.clientY),{passive:true});
  document.documentElement.addEventListener('mouseleave',hide);
  document.documentElement.addEventListener('mouseenter',()=>{ if(!dead) bee.classList.add('on'); });
  /* pages live in iframes; they report the pointer in their own coordinates */
  window.addEventListener('message',function(e){
    const m=e.data; if(!m||!m.abk) return;
    if(m.abk==='hello' && e.source){ try{ e.source.postMessage({abk:'bee',on:true},'*'); }catch(err){} return; }
    if(m.abk==='pointerleave'){ hide(); return; }
    if(m.abk==='forage'){ if(m.on) forageOn(m.mode); else forageOff(); return; }
    if(m.abk!=='pointer') return;
    const frames=document.querySelectorAll('iframe');
    let fr=null; for(const f of frames){ if(f.contentWindow===e.source){ fr=f; break; } }
    if(!fr) return;
    const r=fr.getBoundingClientRect(), k=r.width/(fr.offsetWidth||r.width);
    /* Is the pointer over a link inside the page? Two ways, in this order:
       1. the page tells us (m.link). Pages built after this change report it,
          and it works everywhere, including from a file:// folder.
       2. we look for ourselves via the iframe's document. Works only when the
          reader is served over http, since browsers refuse cross-document
          access between local files - which is why 1 exists. */
    let over;                       /* undefined means "we don't know" */
    if(typeof m.link==='boolean'){ over=m.link; }
    else {
      try{
        const d=fr.contentDocument;
        if(d){ const el=d.elementFromPoint(m.x,m.y);
               over=!!(el && el.closest && el.closest('a[href],area[href]')); }
      }catch(err){}
    }
    aim(r.left+m.x*k, r.top+m.y*k, over);
  });
  (function frame(){
    /* leaving: a target a fixed distance to the left keeps an even flight out of frame */
    if(exiting){ tx=x-45; ty=y; ta=270;
      if(x < -120){ exiting=false; dead=true; bee.classList.remove('on'); } }
    x+=(tx-x)*0.5; y+=(ty-y)*0.5;
    const want = scrollTa===null ? ta : scrollTa;     /* scrolling overrides the flight heading */
    const d=((want-a+540)%360)-180; a+=d*0.15;
    bee.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0) rotate('+a.toFixed(1)+'deg) translate(-50%,-50%)';
    requestAnimationFrame(frame);
  })();
})();

window.addEventListener('message',function(e){ const m=e&&e.data; if(!m||m.abk!=='key') return;
  document.dispatchEvent(new KeyboardEvent('keydown',{key:m.key,bubbles:true})); });
window.addEventListener('hashchange',route);
if(location.hash) route(); else document.getElementById('cover').scrollIntoView();
maybeIntro();
